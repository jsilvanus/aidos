name: Build and Publish Android APK

on:
  push:
    branches: [main, develop]
    paths: ['runtime/**', '.github/workflows/android-build-and-publish.yml']
  pull_request:
    branches: [main, develop]
    paths: ['runtime/**', '.github/workflows/android-build-and-publish.yml']
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Set up keystore from secrets (optional)
        working-directory: runtime
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️  KEYSTORE_BASE64 secret not configured. Building unsigned APK."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/aidos-keystore.jks"
            echo "✓ Keystore file restored from secret"
            export KEYSTORE_FILE="${{ github.workspace }}/aidos-keystore.jks"
          fi
      
      - name: Build release APK
        working-directory: runtime
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/aidos-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :androidapp:assembleRelease --no-daemon -i
      
      - name: Find and inspect APK
        id: find-apk
        run: |
          # Find release APK
          APK_PATH=$(find ./runtime -name "*release*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Error: APK not found after build"
            find ./runtime -name "*.apk" -type f
            exit 1
          fi
          
          echo "✓ Found APK: $APK_PATH"
          echo "apk-path=$APK_PATH" >> $GITHUB_OUTPUT
          
          # Get APK size
          SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          echo "APK size: $SIZE"
          echo "apk-size=$SIZE" >> $GITHUB_OUTPUT
      
      - name: Upload APK to GitHub Packages via Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY_URL: https://maven.pkg.github.com/${{ github.repository_owner }}/aidos
        run: |
          # Extract version info
          MANIFEST_PATH="./runtime/androidapp/src/androidMain/AndroidManifest.xml"
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_SHA=${{ github.sha }}
          
          # Use build number and commit as version
          VERSION="0.1.0-build.$BUILD_NUMBER+${COMMIT_SHA:0:8}"
          APK_FILE="${{ steps.find-apk.outputs.apk-path }}"
          
          echo "Publishing APK:"
          echo "  Version: $VERSION"
          echo "  File: $APK_FILE"
          echo "  Registry: $REGISTRY_URL"
          
          # Create settings.xml for Maven authentication
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
            http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-packages</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          
          # Publish APK using Maven deploy
          mvn deploy:deploy-file \
            -DgroupId=fi.italeino \
            -DartifactId=aidos-android \
            -Dversion="${VERSION}" \
            -Dpackaging=apk \
            -Dfile="$APK_FILE" \
            -DrepositoryId=github-packages \
            -Durl="${REGISTRY_URL}" \
            -s $HOME/.m2/settings.xml \
            --no-transfer-progress || echo "Note: Maven publish step may require manual setup"
      
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aidos-android-release-apk
          path: ${{ steps.find-apk.outputs.apk-path }}
          retention-days: 30
          compression-level: 0
      
      - name: Create Release Summary
        if: success()
        run: |
          echo "## ✅ APK Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Information:**" >> $GITHUB_STEP_SUMMARY
          echo "- APK: $(basename '${{ steps.find-apk.outputs.apk-path }}')" >> $GITHUB_STEP_SUMMARY
          echo "- Size: ${{ steps.find-apk.outputs.apk-size }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

