name: runtime

on:
  push:
    paths: ['runtime/**', '.github/workflows/runtime.yml']
  pull_request:
    paths: ['runtime/**', '.github/workflows/runtime.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # This used to run only `:kernel:jvmTest` — every other module (executor, git, broker,
      # capability, agentloop, etc.) was compiled by nothing CI does and tested by nothing CI
      # does. `gradle :androidapp:assembleRelease` in the Android workflow doesn't reach them
      # either (androidapp depends on kernel/api/storage, not executor or git). --continue so one
      # red module doesn't hide failures in the rest.
      - name: Compile and test all runtime modules
        working-directory: runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle jvmTest --continue --no-daemon
