name: schema

on:
  push:
    paths: ['schema/**', 'docs/rfcs/**', '.github/workflows/schema.yml']
  pull_request:
    paths: ['schema/**', 'docs/rfcs/**', '.github/workflows/schema.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schema
        run: python3 schema/check.py
