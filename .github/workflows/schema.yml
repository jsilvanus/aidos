name: schema

on:
  push:
    paths: ['schema/**', 'docs/rfcs/**', 'scripts/rfc/**', 'agent/**', 'engine/**', 'sdk/**', 'kernel/**', '.github/workflows/schema.yml']
  pull_request:
    paths: ['schema/**', 'docs/rfcs/**', 'scripts/rfc/**', 'agent/**', 'engine/**', 'sdk/**', 'kernel/**', '.github/workflows/schema.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schema
        run: python3 schema/check.py
      # Also fails when an RFC's Implementation Files block lists a file that no longer exists,
      # which is why code paths trigger this workflow.
      - name: Validate RFC post-MVP checklists and Implementation Files
        run: python3 scripts/rfc/postmvp.py --report
